[package]
name = "maprisma-hue-lights"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Maprisma Lights: multi-brand local smart lighting & Floorplan Studio for Linux (COSMIC, KDE, Hyprland)"

[[bin]]
name = "maprisma-hue-lights-tray"
path = "src/tray/main.rs"

[dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# POSIX localtime_r in src/model.rs.
libc = "0.2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
maprisma-kit = { git = "https://github.com/maprisma/maprisma-kit-rs", tag = "v0.1.0" }

[dependencies.libcosmic]
# pop-os/libcosmic 95236a9 (what COSMIC's own applets 1.11 are built against) plus one fix:
# the window zoom reaches iced, so --window windows follow the desktop's text size (look.rs).
git = "https://github.com/maprisma/libcosmic"
rev = "40d534c5d5a463cc473e0c9f01ad2da068b11bcd"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit", "xdg-portal"]

[profile.release]
lto = "thin"
