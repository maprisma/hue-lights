[package]
name = "cosmic-hue-lights"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet for Philips Hue: rooms, zones, lights and scenes"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# The revision COSMIC's own applets (cosmic-applets 1.11) are built against.
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
